name: FilmUp advance-booking checks

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Karachi'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filmup-advance-booking-check
  cancel-in-progress: false

jobs:
  check-booking:
    name: Check confirmed booking alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out FilmUp
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check for newly available booking slots
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: FilmUp Notifications
          TIMEZONE: Asia/Karachi
        run: python run_advance_booking_check.py
