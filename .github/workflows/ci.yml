name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate README image assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          images = re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\']', readme, re.IGNORECASE)
          missing = [source for source in images if not Path(source).is_file()]
          empty = [source for source in images if Path(source).is_file() and Path(source).stat().st_size == 0]
          if missing or empty:
              raise SystemExit(f"README image assets invalid. Missing: {missing}; empty: {empty}")
          print(f"Validated {len(images)} local README image asset(s).")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies for unit tests
        run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
