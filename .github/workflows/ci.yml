name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate README image assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          images = re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)["\']', readme, re.IGNORECASE)
          missing = [source for source in images if not Path(source).is_file()]
          empty = [source for source in images if Path(source).is_file() and Path(source).stat().st_size == 0]
          if missing or empty:
              raise SystemExit(f"README image assets invalid. Missing: {missing}; empty: {empty}")
          print(f"Validated {len(images)} local README image asset(s).")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies for unit tests
        run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend cloudflare/worker/src
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
      - name: Validate Cloudflare Worker configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cloudflare/worker')
          config = json.loads((root / 'wrangler.jsonc').read_text(encoding='utf-8'))
          assert config['main'] == 'src/index.ts'
          assert set(config['triggers']['crons']) == {'5 * * * *', '*/5 * * * *'}
          worker = (root / 'src/index.ts').read_text(encoding='utf-8')
          jobs = Path('.github/workflows/cloudflare-jobs.yml').read_text(encoding='utf-8')
          assert (root / 'src/index.ts').is_file()
          assert 'RESEND_API_KEY' in worker and 'api.resend.com/emails' in worker
          assert 'BREVO_API_KEY' not in worker and 'api.brevo.com' not in worker
          assert "ADVANCE_BOOKING_DRY_RUN: 'true'" in jobs
          print('Cloudflare Worker configuration and safe email defaults are valid.')
          PY

  cloudflare-worker:
    name: Cloudflare Worker validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Worker build with Wrangler
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/filmup-worker-dist --config cloudflare/worker/wrangler.jsonc
